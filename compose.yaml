services:
  dev:
    build: .
    image: netrunner-web-dev
    # mount the source for hot reload; keep the container's own node_modules
    command: sh -c "npm ci && npm run dev -- --host"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
volumes:
  node_modules:
